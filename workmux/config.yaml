# worktrees open as windows in the current session, not separate sessions
mode: window
# don't add agent icons to tmux windows (the sidebar already shows status)
status_format: false
nerdfont: true
# default agent
agent: claude

# live agent status pane. NOT automatic — toggle it with `workmux sidebar`
# (prefix + W). This block only styles it. `-s` scopes it to one session.
sidebar:
  position: left
  width: 40
  layout: tiles

# agent based branch name creation: workmux add -A
# no `model` key needed: agent: claude implies `claude --model haiku -p`
auto_name:
  system_prompt: >
    Generate a kebab-case git branch name with an appropriate prefix.
    Output only the name. Max 50 chars.
  background: true

# [ sidebar | claude | nvim ] — sidebar is managed above, these two are the window
panes:
  - command: <agent>
    focus: true
  - command: nvim
    split: horizontal
