# ~/.config/tmux/tmux.conf

# ----------------------------------------------------------------------
# General
# ----------------------------------------------------------------------
# Reload config with: prefix + r
unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g mouse on

# Enable true color (RGB) in xterm-compatible terminals
set-option -sa terminal-overrides ",xterm*:Tc"

# ----------------------------------------------------------------------
# Pane navigation (prefix + h/j/k/l)
# ----------------------------------------------------------------------
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# ----------------------------------------------------------------------
# Plugins  (all `set -g @plugin` lines must come BEFORE `run tpm`)
# ----------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'

# --- catppuccin (v2) ---
# Pin to a v2 tag so a future update can't silently break the config again.
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'mocha'                 # latte | frappe | macchiato | mocha
set -g @catppuccin_window_status_style "rounded"  # replaces the old separator/fill options
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #W"              # was @catppuccin_window_default_text
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_directory_text "#{pane_current_path}"

# --- vim navigator ---
set -g @plugin 'christoomey/vim-tmux-navigator'

# --- zoxide ---
set -g @plugin 'jeffnguyen695/tmux-zoxide-session'

# Initialize TPM — keep this AFTER every @plugin line above.
run '~/.tmux/plugins/tpm/tpm'

# ----------------------------------------------------------------------
# Status line
# In catppuccin v2 the status modules MUST be set AFTER `run tpm`,
# because the plugin defines the @catppuccin_status_* variables we
# reference here with #{E:...}.
# ----------------------------------------------------------------------
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
# To also show the current directory on the right, uncomment:
# set -ag status-right "#{E:@catppuccin_status_directory}"

# ----------------------------------------------------------------------
# Popups
# ----------------------------------------------------------------------
bind C-y display-popup \
	-d "#{pane_current_path}" \
	-w 90% \
	-h 90% \
	-E "lazygit"

bind C-r display-popup \
	-d "#{pane_current_path}" \
	-w 90% \
	-h 90% \
	-E "ranger"

bind C-t display-popup \
	-d "#{pane_current_path}" \
	-w 90% \
	-h 90% \
	-E "zsh"

bind C-o display-popup \
	-d "/Users/poulycroc/PoulyStuff" \
	-w 90% \
	-h 90% \
	-E "nvim ."
